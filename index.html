<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GTA · Geometria, Trigonometria e Álgebra</title>
<meta name="description" content="GTA: Geometria, Trigonometria e Álgebra. Jogo educativo de matemática. Em breve.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap">
<style>
  :root {
    --sky-1: #2b0b4f; --sky-2: #a3167a; --sky-3: #ff5e3a; --sky-4: #ffb02e;
    --ink: #fff7ec; --acid: #b6ff3b; --pink: #ff2e93; --cyan: #22e3ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    font: 400 1rem/1.6 Inter, system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 50% 78%, rgba(255, 210, 90, 0.9) 0 9%, rgba(255, 120, 60, 0) 26%),
      linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 42%, var(--sky-3) 70%, var(--sky-4) 100%);
    overflow-x: hidden;
  }
  /* Silhueta da cidade */
  body::after {
    content: "";
    position: fixed;
    inset: auto 0 0 0;
    height: 28vh;
    background: #1a0630;
    clip-path: polygon(0 60%, 6% 60%, 6% 30%, 12% 30%, 12% 50%, 18% 50%, 18% 10%, 24% 10%, 24% 45%, 31% 45%, 31% 25%, 37% 25%, 37% 55%, 44% 55%, 44% 0, 50% 0, 50% 40%, 57% 40%, 57% 20%, 64% 20%, 64% 50%, 70% 50%, 70% 15%, 77% 15%, 77% 45%, 84% 45%, 84% 30%, 91% 30%, 91% 55%, 100% 55%, 100% 100%, 0 100%);
    z-index: -1;
  }
  main { max-width: 640px; text-align: center; }
  .tag {
    display: inline-block;
    padding: 4px 12px;
    font-weight: 800;
    font-size: 0.8rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #1a0630;
    background: var(--acid);
    transform: rotate(-2deg);
  }
  h1 {
    margin: 18px 0 6px;
    font: 400 clamp(5rem, 22vw, 9.5rem)/0.9 Anton, Impact, sans-serif;
    letter-spacing: 0.02em;
    color: var(--ink);
    -webkit-text-stroke: 3px #1a0630;
    text-shadow: 6px 6px 0 var(--pink), 12px 12px 0 #1a0630;
  }
  .sub {
    margin: 0;
    font: 400 clamp(1.1rem, 4.5vw, 1.6rem)/1.2 Anton, Impact, sans-serif;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--cyan);
    text-shadow: 3px 3px 0 #1a0630;
  }
  .stars { margin: 22px 0 8px; font-size: 2rem; letter-spacing: 0.15em; color: var(--sky-4); text-shadow: 2px 2px 0 #1a0630; }
  .stars span { color: rgba(255, 255, 255, 0.3); }
  .stars-label { margin: 0; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.85; }
  .lead { margin: 22px auto 0; max-width: 34ch; font-size: 1.1rem; }
  .soon {
    display: inline-block;
    margin-top: 26px;
    padding: 14px 28px;
    font: 400 1.4rem/1 Anton, Impact, sans-serif;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #1a0630;
    background: var(--ink);
    border: 3px solid #1a0630;
    box-shadow: 6px 6px 0 #1a0630;
  }
</style>
</head>
<body>
<main>
  <span class="tag">Em obras</span>
  <h1>GTA</h1>
  <p class="sub">Geometria · Trigonometria · Álgebra</p>
  <p class="stars" aria-hidden="true">★★<span>★★★</span></p>
  <p class="stars-label">Nível de conhecimento: subindo</p>
  <p class="lead">A cidade tá cheia de ângulo, triângulo e equação esperando por você. Segura aí que o jogo tá chegando.</p>
  <p class="soon">Em breve</p>
</main>
</body>
</html>
